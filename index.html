<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול שוברים</title>
    <meta name="description" content="מערכת לניהול שוברי הנחה וסבסוד">

    <!-- Google Fonts - Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">🎫 מערכת שוברים</h1>
                <div class="search-container">
                    <input type="text" id="globalSearch" class="search-input"
                        placeholder="🔍 חיפוש מוסדות, קבוצות, אנשים...">
                    <div id="searchResults" class="search-results hidden"></div>
                </div>
                <div class="export-dropdown">
                    <button id="exportBtn" class="btn btn-secondary">
                        📤 ייצוא ▼
                    </button>
                    <div id="exportMenu" class="export-menu hidden">
                        <button class="export-option" id="exportTxt">📄 ייצוא לטקסט (TXT)</button>
                        <button class="export-option" id="exportExcel">📊 ייצוא לאקסל (CSV)</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            <!-- Content will be loaded dynamically -->
        </main>

        <!-- Floating Action Button -->
        <button id="fabBtn" class="fab hidden">
            <span class="fab-icon">+</span>
        </button>

        <!-- Modal Container -->
        <div id="modalContainer" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">כותרת</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div id="modalContent" class="modal-body">
                    <!-- Modal content will be loaded dynamically -->
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabaseConfig.js?v=1.1"></script>
    <script src="js/utils.js?v=1.1"></script>
    <script src="js/dataManager.js?v=1.1"></script>
    <script src="js/router.js?v=1.1"></script>
    <script src="js/app.js?v=1.1"></script>
</body>

</html>
